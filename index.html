<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product card</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://googleapis.com" rel="stylesheet" />
  </head>
  <body>
    <main class="catalog">
      <div class="catalog__button container">
        <button id="change-cards-color-button">
          Поменять цвет всех карточек
        </button>
        <button id="change-card-color-button">
          Поменять цвет первой карточки
        </button>
        <button id="open-goole-button">Gogle</button>
        <button id="output-console-log">Вывести сообщение</button>
        <button id="dynamiс-button">Изменить</button>
      </div>
      <div class="catalog__container container">
        <h1 class="title catalog__title">Выбери свой продукт</h1>
        <div class="products clear-list">
          <template id="products-item-template">
            <article class="products__item card">
              <img class="card__img" src="" alt="mousse" />
              <span class="card__specific"></span>
              <h2 class="card__name"></h2>
              <div class="card__description">
                <p></p>
              </div>
              <div class="card__compound compound">
                <span class="compound__name">Состав:</span>
                <ul class="compound__list"></ul>
              </div>
              <div class="card__price">
                <b>Цена</b>
                <div>
                  <span></span>
                  <span>&#x20bd;</span>
                </div>
              </div>
            </article>
          </template>
        </div>
      </div>
    </main>

    <script src="main.js"></script>
    <script src="homework-7.js"></script>
    <script src="homework-8.js"></script>
    <script type="module" src="homework-9.js"></script>
    <script type="module" src="homework-10.js"></script>
  </body>
</html>
